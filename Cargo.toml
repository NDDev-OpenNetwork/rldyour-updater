[package]
name = "rldyour-updater"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Signed release and native package update coordinator for OpenNetwork workstations"
repository = "https://github.com/NDDev-OpenNetwork/rldyour-updater"
homepage = "https://github.com/NDDev-OpenNetwork/rldyour-updater"
keywords = ["updates", "gds", "workstation", "systemd", "launchd"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
fs2 = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
