name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # main
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: python3 scripts/check-version.py
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Stage exact binary and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          cp target/release/rldyour-updater "dist/rldyour-updater-${GITHUB_REF_NAME}-${PLATFORM}"
          python3 - <<'PY'
          import hashlib, pathlib
          for path in pathlib.Path('dist').iterdir():
              path.with_name(path.name+'.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Publish only complete tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(find dist -type f | wc -l)" -eq 4
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "Native tested binaries. Clients authenticate exact bytes using the separately signed update catalogue. Initial installation requires review of the signer trust anchor."
